<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 610" role="img" aria-labelledby="model-title model-description">
  <title id="model-title">Two-feature linear regression for salary prediction</title>
  <desc id="model-description">Scaled experience and education are multiplied by two learned weights. Their weighted sum plus a learned bias predicts salary in thousands of dollars. Federated learning trains these three parameters; homomorphic encryption evaluates the same linear calculation on encrypted features.</desc>
  <defs>
    <marker id="model-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#087d79"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1038" height="608" rx="18" fill="#f5f8fa" stroke="#cbd8df"/>
  <g font-family="system-ui, sans-serif" fill="#173047">
    <text x="30" y="40" font-size="24" font-weight="700">Two-feature linear regression</text>
    <text x="30" y="72" font-size="17" fill="#576c7c">Two numeric inputs → weighted sum + bias → one predicted salary</text>

    <g stroke="#087d79" stroke-width="2.5" fill="none" marker-end="url(#model-arrow)">
      <path d="M 260 190 H 340"/>
      <path d="M 260 320 H 340"/>
      <path d="M 490 190 L 584 231"/>
      <path d="M 490 320 L 584 279"/>
      <path d="M 620 151 V 210"/>
      <path d="M 664 255 H 755"/>
    </g>

    <rect x="30" y="145" width="230" height="90" rx="12" fill="#eaf7f3" stroke="#087d79"/>
    <text x="48" y="174" font-size="20" font-weight="700">Experience · x₁</text>
    <text x="48" y="202" font-size="17">Years of experience / 20</text>
    <text x="48" y="223" font-size="15" fill="#576c7c">Scaled to [0, 1]</text>

    <rect x="30" y="275" width="230" height="90" rx="12" fill="#eaf7f3" stroke="#087d79"/>
    <text x="48" y="304" font-size="20" font-weight="700">Education · x₂</text>
    <text x="48" y="331" font-size="16">Years after secondary / 4</text>
    <text x="48" y="353" font-size="15" fill="#576c7c">Scaled to [0, 1]</text>

    <text x="415" y="126" text-anchor="middle" font-size="17" font-weight="600">Learned weights</text>
    <rect x="340" y="161" width="150" height="58" rx="12" fill="white" stroke="#cbd8df"/>
    <text x="415" y="198" text-anchor="middle" font-size="25">w₁ × x₁</text>
    <rect x="340" y="291" width="150" height="58" rx="12" fill="white" stroke="#cbd8df"/>
    <text x="415" y="328" text-anchor="middle" font-size="25">w₂ × x₂</text>

    <rect x="555" y="91" width="130" height="60" rx="12" fill="white" stroke="#cbd8df"/>
    <text x="620" y="117" text-anchor="middle" font-size="16">Learned bias</text>
    <text x="620" y="140" text-anchor="middle" font-size="23">b</text>
    <circle cx="620" cy="255" r="43" fill="#173047"/>
    <text x="620" y="268" text-anchor="middle" font-size="38" fill="white">+</text>

    <rect x="755" y="211" width="255" height="88" rx="12" fill="#eaf7f3" stroke="#087d79"/>
    <text x="882" y="245" text-anchor="middle" font-size="22" font-weight="700">Predicted salary · ŷ</text>
    <text x="882" y="274" text-anchor="middle" font-size="18">Thousands of dollars ($k)</text>

    <text x="520" y="409" text-anchor="middle" font-size="28" font-weight="600">ŷ = w₁x₁ + w₂x₂ + b</text>
    <text x="520" y="440" text-anchor="middle" font-size="17" fill="#576c7c">The entire model has three learned parameters: θ = [w₁, w₂, b].</text>

    <rect x="30" y="467" width="480" height="115" rx="12" fill="white" stroke="#cbd8df"/>
    <text x="48" y="496" font-size="18" font-weight="700">Part A · Train with federated learning</text>
    <text x="48" y="524" font-size="16">Clients fit θ to their recorded salaries using squared error.</text>
    <text x="48" y="552" font-size="16">The server averages gradients by sample count, then updates the model.</text>

    <rect x="530" y="467" width="480" height="115" rx="12" fill="white" stroke="#cbd8df"/>
    <text x="548" y="496" font-size="18" font-weight="700">Part B · Execute with homomorphic encryption</text>
    <text x="548" y="524" font-size="16">The server applies plaintext weights to encrypted inputs.</text>
    <text x="548" y="552" font-size="16">The client decrypts the returned salary prediction.</text>
  </g>
</svg>
