[project]
name = "sec302-lab-6-private-workflows"
version = "1.0.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "marimo>=0.25.2,<0.26",
  "anywidget>=0.9.18,<1",
  "traitlets>=5.14,<6",
  "tenseal==0.3.18",
  "numpy>=2,<3",
  "matplotlib>=3.9,<4",
]

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.marimo.runtime]
auto_instantiate = true
on_cell_change = "autorun"
