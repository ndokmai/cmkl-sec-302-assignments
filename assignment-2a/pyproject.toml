[project]
name = "assignment-2a"
version = "0.1.0"
description = "Fashion-MNIST PGD and adversarial training assignment"
requires-python = ">=3.12,<3.15"
dependencies = [
  "numpy>=2.0,<3",
  "scikit-learn>=1.5,<2",
  "matplotlib>=3.9,<4",
  "scipy>=1.14,<2",
  "nbformat>=5.10,<6",
  "nbclient>=0.10,<1",
  "ipykernel>=6.29,<8",
  "jupyterlab>=4,<5",
  "tensorflow>=2.16,<3",
  "keras>=3",
  "adversarial-robustness-toolbox==1.20.1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false
