[project]
name = "lab-3"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "anywidget>=0.9.18,<1",
    "cloudpickle>=3.1,<4",
    "marimo>=0.25.2,<0.26",
    "matplotlib>=3.9,<4",
    "numpy>=2,<3",
    "traitlets>=5.14,<6",
]

[dependency-groups]
dev = ["pytest>=9,<10", "scikit-learn>=1.6,<2"]

[tool.marimo.runtime]
auto_instantiate = true
on_cell_change = "autorun"
